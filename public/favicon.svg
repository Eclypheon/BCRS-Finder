<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#grad)" filter="url(#shadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Inner stylized icon: Modern Bottle + Map Location Pin -->
  <g transform="translate(256, 256)">
    <!-- Location Pin Ring Background -->
    <circle cx="0" cy="-20" r="140" fill="#064e3b" fill-opacity="0.4"/>
    
    <!-- Recycling circular arrows surrounding pin -->
    <path d="M -110,-20 A 110,110 0 0,1 60,-112" fill="none" stroke="#a7f3d0" stroke-width="20" stroke-linecap="round"/>
    <polygon points="60,-130 90,-105 60,-80" fill="#a7f3d0"/>

    <path d="M 110,-20 A 110,110 0 0,1 -60,72" fill="none" stroke="#a7f3d0" stroke-width="20" stroke-linecap="round"/>
    <polygon points="-60,90 -90,65 -60,40" fill="#a7f3d0"/>

    <!-- Bottle silhouette in center -->
    <!-- Cap -->
    <rect x="-24" y="-120" width="48" height="24" rx="8" fill="#ffffff"/>
    <!-- Neck -->
    <path d="M -18,-96 L -18,-70 C -18,-50 -55,-30 -55,10 L -55,100 C -55,115 -40,125 -25,125 L 25,125 C 40,125 55,115 55,100 L 55,10 C 55,-30 18,-50 18,-70 L 18,-96 Z" fill="#ffffff"/>

    <!-- Green Leaf / Scheme emblem on bottle -->
    <circle cx="0" cy="20" r="28" fill="#10b981"/>
    <path d="M -10,25 C -10,5 15,10 15,10 C 15,30 -10,35 -10,25 Z" fill="#ffffff"/>
  </g>
</svg>
