name: Deploy to GitHub Pages

on:
  schedule:
    # Run every 10 minutes to auto-sync fresh machine statuses
    - cron: '*/10 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: github.event_name != 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'push'
        run: npm ci

      # Pushes deploy the dist/ committed by the developer (built locally
      # with `npm run build`). Scheduled and manual runs rebuild here
      # because they also refresh the seed data.
      - name: Fetch Live BCRS Statuses & Build
        if: github.event_name != 'push'
        run: npm run build

      - name: Commit updated seed data (on schedule or dispatch)
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/seed-rvms.json src/data/seed-rvms.json
          if git diff --quiet && git diff --staged --quiet; then exit 0; fi
          git commit -m "chore(data): auto-sync BCRS statuses [skip ci]"
          git pull --rebase origin main
          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
